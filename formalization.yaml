# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "hjoa3small"
  authors: [Kenny Lau]
  description: >
    `hjoa3small` is a formal proof of the small cases at $a = 3$ of the Huang-Jiang-Oblomkov
    conjecture treated in *Algebraic geometric framework of Rogers-Ramanujan identities*
    (arXiv:2608.15219). It proves Theorem 6, the sum-to-sum conjecture at $b = 4, 5, 7, 8$;
    Theorem 7, the sum-to-sum conjecture at $q = 1$; and Theorem 3, the HJO conjecture for
    $a = 3$ and $b = 4, 5, 7, 8$, assuming Warnaar's Theorem 1.1. The Lean files were generated by
    AxiomProver, Axiom Math's in-house theorem proving system.
  responsible_maintainers: [Kenny Lau]
  license: "Apache-2.0"

repository:
  role: "substantive-development"

sources:
  - title: "Algebraic geometric framework of Rogers--Ramanujan identities"
    authors: [Yifeng Huang, Kenny Lau, Ken Ono, Peter Paule]
    id: "https://arxiv.org/abs/2608.15219"
    type: "article"
    location: "Theorem 3, Theorem 6, Theorem 7"
    relationship: "formalizes"
    note: >
      Formalizes the two sum-to-sum results and the HJO cases they yield.
  - title: "The $A_2$ Andrews-Gordon identities and cylindric partitions"
    authors: [S. O. Warnaar]
    id: "https://arxiv.org/abs/2111.07550"
    type: "article"
    location: "Preprint (2021), Theorem 1.1, equations (1.10)-(1.11)"
    relationship: "background"
    note: "The sole external input assumed by `thm_main`."

classification:
  arxiv: [math.NT, math.CO, math.RT]

status:
  scope: >
    Theorem 6 for $b = 4, 5, 7, 8$, Theorem 7 for every level, and Theorem 3 conditional on
    Warnaar's Theorem 1.1, which `Challenge/Basic.lean` assumes whole as `AndrewsGordon.Theorem11`
    rather than in the four instances the proof uses.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]
  main_results:
  - declaration: "HJOA3.Challenge.thm_sum"
    file: "Solution/Basic.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "Comparator/comparator.json"
  - declaration: "HJOA3.Challenge.thm_q1"
    file: "Solution/Basic.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "Comparator/comparator.json"
  - declaration: "HJOA3.Challenge.thm_main"
    file: "Solution/Basic.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "Comparator/comparator.json"
    literature_dependencies:
    - statement: >
        `AndrewsGordon.Theorem11`: Warnaar's Theorem 1.1, both families at every level - the
        modulus-$(3\mathbf{k}+2)$ identity (1.10) and the modulus-$(3\mathbf{k}+1)$ identity
        (1.11).
      source: "The $A_2$ Andrews-Gordon identities and cylindric partitions, Theorem 1.1, (1.10)-(1.11)"

automation:
  methods:
    - method: "autonomous"
      models: [AxiomProver]

review:
  status: "author-verified"
  reviewers: [Kenny Lau]
  notes: >
    The formal challenge in `Challenge/Basic.lean` was checked against the source paper by an
    author of that paper.

alignment:
  statements:
    - source: "Algebraic geometric framework of Rogers--Ramanujan identities (Theorem 6)"
      lean: "HJOA3.Challenge.thm_sum"
      module: "Solution.Basic"
      status: "Proved."
    - source: "Algebraic geometric framework of Rogers--Ramanujan identities (Theorem 7)"
      lean: "HJOA3.Challenge.thm_q1"
      module: "Solution.Basic"
      status: "Proved."
    - source: "Algebraic geometric framework of Rogers--Ramanujan identities (Theorem 3)"
      lean: "HJOA3.Challenge.thm_main"
      module: "Solution.Basic"
      status: "Proved, conditional on Warnaar's Theorem 1.1."
